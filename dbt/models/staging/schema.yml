version: 2
models:
- name: stg_orders
  description: One row per order with typed timestamps and derived purchase / delivery dates.
  columns:
  - name: order_id
    tests:
    - unique
    - not_null
  - name: customer_id
    tests:
    - not_null
  - name: order_status
    tests:
    - accepted_values:
        arguments:
          values:
          - delivered
          - shipped
          - canceled
          - unavailable
          - invoiced
          - processing
          - created
          - approved
  - name: purchased_at
    tests:
    - not_null
- name: stg_customers
  description: One row per order-level customer_id.
  columns:
  - name: customer_id
    tests:
    - unique
    - not_null
  - name: customer_unique_id
    tests:
    - not_null
  - name: customer_state
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('brazil_states')
          field: state_code
- name: stg_sellers
  columns:
  - name: seller_id
    tests:
    - unique
    - not_null
  - name: seller_state
    tests:
    - relationships:
        arguments:
          to: ref('brazil_states')
          field: state_code
- name: stg_order_items
  description: One row per order line item.
  columns:
  - name: order_item_key
    tests:
    - unique
    - not_null
  - name: order_id
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_orders')
          field: order_id
  - name: price
    tests:
    - not_null
    - non_negative
  - name: freight_value
    tests:
    - not_null
    - non_negative
- name: stg_order_payments
  columns:
  - name: payment_key
    tests:
    - unique
    - not_null
  - name: payment_type
    tests:
    - accepted_values:
        arguments:
          values:
          - credit_card
          - boleto
          - voucher
          - debit_card
          - not_defined
  - name: payment_value
    tests:
    - non_negative
- name: stg_order_reviews
  columns:
  - name: review_key
    tests:
    - unique
    - not_null
  - name: review_score
    tests:
    - between:
        arguments:
          min_value: 1
          max_value: 5
- name: stg_products
  columns:
  - name: product_id
    tests:
    - unique
    - not_null
  - name: category_name
    tests:
    - not_null
- name: stg_geolocation_zip
  columns:
  - name: zip_prefix
    tests:
    - unique
    - not_null
  - name: latitude
    tests:
    - between:
        arguments:
          min_value: -34.0
          max_value: 6.0
